# Server
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5434/insurexdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# JWT
app.jwt.secret=3b8e4f2a9c1d7e6f0a2b5c8d3e1f4a7b9c2d5e8f1a4b7c0d3e6f9a2b5c8d1e4f7a2b5c8d1e4b7c0
app.jwt.expiration-ms=86400000

# File Storage
app.storage.location=./storage

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Mail (uses console logging if SMTP not configured)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduling
spring.task.scheduling.pool.size=2

# Logging
logging.level.com.insurex=DEBUG
logging.level.org.springframework.statemachine=WARN
logging.level.org.springframework.security=WARN
